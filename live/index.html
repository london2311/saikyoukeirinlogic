<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>期待値ボード</title>
<style>
:root {
  --bg: #f3f5fa; --card: #ffffff; --ink: #172033; --sub: #5d6680; --line: #e3e7ef;
  --accent: #2f5bea; --accent-soft: #eaf0ff; --good: #0e8a4f; --good-soft: #e2f6ec; --warn: #a15c00; --warn-soft: #fff3dc;
  --bad: #c2272d; --gold1: #ffd76a; --gold2: #ff9f43;
  --t-q: #1f6feb; --t-w: #12a150; --t-f: #8b5cf6; --t-e: #f08c00; --t-t: #e5484d;
}
@media (prefers-color-scheme: dark) {
  .car { border-color: rgba(255,255,255,.45); }
  :root { --bg: #0f131b; --card: #19202c; --ink: #e9edf5; --sub: #9aa4ba; --line: #2b3342;
    --accent: #7c9cff; --accent-soft: #1d2847; --good: #44c98a; --good-soft: #12302a; --warn: #f2b24c; --warn-soft: #33270f; --bad: #ff7b72; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: linear-gradient(120deg, #2f5bea, #7b4fc4); color: #fff; padding: 10px 16px 8px; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
header h1 { font-size: 18px; margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
header .upd { font-size: 12px; opacity: .85; font-weight: normal; }
main { max-width: 860px; margin: 0 auto; padding: 12px 16px 60px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; }
.tab { flex: none; border: 1px solid rgba(255,255,255,.5); background: rgba(255,255,255,.12); color: #fff; border-radius: 999px; padding: 5px 14px; font-size: 14px; cursor: pointer; }
.tab.on { background: #fff; color: #2f5bea; font-weight: 700; }
.tab .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; margin-left: 5px; vertical-align: middle; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin: 10px 0; }
.race { cursor: pointer; border-left: 6px solid var(--line); }
.race.hot { border-left-color: #12a150; box-shadow: 0 2px 12px rgba(18,161,80,.15); }
.race.gold { border-left-color: #ff9f43; box-shadow: 0 2px 14px rgba(255,159,67,.25); }
.race .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.ttl { font-weight: 800; font-size: 17px; }
.muted { color: var(--sub); font-size: 13px; }
.pill { display: inline-block; font-size: 12px; padding: 1px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin: 2px 4px 2px 0; }
.pill.good { background: var(--good-soft); color: var(--good); font-weight: 700; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.off { background: transparent; color: var(--sub); border: 1px dashed var(--line); }
.pill.done { background: #2f5bea; color: #fff; }
.count { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.count.soon { background: #ffe1e1; color: #c2272d; }
.count.past { background: transparent; color: var(--sub); }
.car { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; font-weight: 800; font-size: 13px;
  border: 1.5px solid rgba(0,0,0,.25); font-variant-numeric: tabular-nums; flex: none; }
.car.big { width: 32px; height: 32px; font-size: 16px; }
td .car { width: 21px; height: 21px; font-size: 12px; }
td .combo { gap: 1px; }
td .evb { padding: 2px 5px; font-size: 11px; }
th, td { padding-left: 3px; padding-right: 3px; }
.combo { display: inline-flex; align-items: center; gap: 3px; flex-wrap: nowrap; white-space: nowrap; }
.combos { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.combos .combo { padding: 2px 5px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); }
.combo .sep { color: var(--sub); font-weight: 700; font-size: 12px; }
.tb { display: inline-block; font-size: 12px; font-weight: 800; color: #fff; padding: 1px 8px; border-radius: 6px; white-space: nowrap; }
.evb { display: inline-block; font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.evb.s { background: linear-gradient(90deg, var(--gold1), var(--gold2)); color: #4a2500; }
.evb.a { background: #12a150; color: #fff; }
.evb.b { background: #ffe58a; color: #5a4300; }
.evb.c { background: var(--line); color: var(--sub); }
.rec { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 12px; border-radius: 14px; margin: 8px 0;
  background: var(--card); border: 2px solid #12a150; }
.rec.s { border-color: #ff9f43; background: linear-gradient(135deg, rgba(255,215,106,.25), rgba(255,159,67,.12)), var(--card); }
.rec .line2 { grid-column: 1 / -1; font-size: 13px; color: var(--sub); }
.rec .buy { font-size: 15px; font-weight: 800; color: var(--good); }
.rec.s .buy { color: #c05600; }
.hero h2 { margin: 0 0 4px; font-size: 17px; }
.skip { padding: 14px; border-radius: 14px; background: repeating-linear-gradient(135deg, var(--card), var(--card) 10px, var(--bg) 10px, var(--bg) 20px); border: 1px dashed var(--sub); }
.mini { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; font-size: 13px; }
.seg { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
.seg button { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 6px 12px; cursor: pointer; font-size: 14px; }
.seg button.on { border-color: #2f5bea; color: #fff; background: #2f5bea; font-weight: 700; }
.seg button:disabled { opacity: .35; cursor: default; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; vertical-align: middle; }
th:first-child, td:first-child { text-align: left; white-space: normal; }
th { color: var(--sub); font-weight: 600; font-size: 12px; }
tr.buy td { background: var(--good-soft); }
tr.buy.s td { background: rgba(255,215,106,.28); }
h2 { font-size: 15px; margin: 16px 0 6px; }
.th2 { display: flex; align-items: center; gap: 6px; margin: 0 0 6px; font-size: 15px; }
.back { border: none; background: none; color: #fff; font-size: 15px; padding: 0; cursor: pointer; font-weight: 700; }
.login { max-width: 360px; margin: 18vh auto 0; }
.login input[type=password] { width: 100%; font-size: 16px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); }
.login button { margin-top: 10px; width: 100%; font-size: 16px; padding: 10px; border: none; border-radius: 8px; background: linear-gradient(120deg, #2f5bea, #7b4fc4); color: #fff; cursor: pointer; font-weight: 700; }
.bad { color: var(--bad); font-weight: 700; }
.rep td, .rep th { white-space: nowrap; }
.rep td.wrap { white-space: normal; min-width: 11em; }
.err { color: var(--bad); font-size: 13px; margin-top: 8px; min-height: 1em; }
.note { font-size: 12px; color: var(--sub); margin-top: 14px; }
.riders { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 13px; color: var(--sub); margin-top: 6px; }
.riders span { display: inline-flex; align-items: center; gap: 4px; }
.winbar { display: flex; height: 10px; border-radius: 6px; overflow: hidden; margin-top: 8px; }
.more { margin-top: 6px; border: none; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 14px; }
.scroll { overflow-x: auto; }
.grp { margin: 6px 0; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); }
.grp.a { border: 2px solid #12a150; }
.grp.s { border: 2px solid #ff9f43; background: linear-gradient(135deg, rgba(255,215,106,.2), transparent), var(--card); }
.cut { margin-top: 6px; padding: 6px 8px; border-left: 4px solid #12a150; background: var(--good-soft); border-radius: 8px; font-size: 14px; }
.betbtn { border: none; border-radius: 10px; padding: 8px 16px; font-size: 15px; font-weight: 800; color: #fff; cursor: pointer;
  background: linear-gradient(120deg, #12a150, #0e8a4f); box-shadow: 0 2px 6px rgba(18,161,80,.35); }
.betbtn:disabled { opacity: .6; }
.ev2 { display: grid; gap: 4px; justify-items: start; margin-top: 2px; }
.ev2row { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: 14px; color: var(--ink); }
.ev2lab { font-size: 11px; color: var(--sub); border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; }
.ev2lab.fin { color: var(--accent); border-color: var(--accent); font-weight: 700; }
.ev2now { color: var(--sub); font-weight: 700; }
.addbet { border: 1px solid var(--good); color: var(--good); background: transparent; border-radius: 8px; padding: 3px 8px; font-size: 12px; font-weight: 700; white-space: nowrap; cursor: pointer; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--sub); }
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
  'use strict';
  // ---- 設定（GitHub Pages の URL から自動で決める）
  const OWNER = location.hostname.split('.')[0] || 'london2311';
  const REPO = location.pathname.split('/').filter(Boolean)[0] || 'saikyoukeirinlogic';
  const BRANCH = 'site-data';
  // 更新の確認間隔: GitHub の API は、トークン無しだと1時間60回までなので60秒。資金管理のトークンがあれば15秒
  const REFRESH_SEC = () => (st.tok ? 15 : 60);
  const SNAPS = ['C-15', 'C-10', 'C-5', 'C-2', 'LIVE'];  // 締切の15・10・5・2分前 と、締切6分前からの30秒ごとの最新
  const SNAP_LABEL = { 'C-15': '締切15分前', 'C-10': '締切10分前', 'C-5': '締切5分前', 'C-2': '締切2分前', LIVE: '最新' };
  const TYPES = ['2車複', 'ワイド', '3連複', '2車単', '3連単'];
  const VALIDATED = new Set(['2車複', 'ワイド']);
  const app = document.getElementById('app');
  const EV_OPTIONS = [['0.8', 0.8], ['0.9', 0.9], ['1.0', 1.0], ['1.1', 1.1], ['全部', 0]];
  const st = { page: 'board', bank: null, tok: null, evMin: 0.9, view: null, key: null, meta: null, sha: null, index: null, venue: null, race: null, raceData: null, snap: null, showAll: {}, timer: null };

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 保存できない環境 */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* noop */ } },
  };
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const pct = (p) => (p * 100).toFixed(p < 0.1 ? 1 : 0) + '%';
  const x1 = (v) => (v == null ? '-' : Number(v).toFixed(1));
  const fmtKey = (bt, k) => (bt === '2車単' || bt === '3連単') ? k.replace(/-/g, '→') : k.replace(/-/g, '=');
  // 車番の色（競輪の枠の色）と券種の色
  const CAR = { 1: ['#ffffff', '#1d1d1d'], 2: ['#1f1f1f', '#ffffff'], 3: ['#e0262b', '#ffffff'], 4: ['#1f5fd1', '#ffffff'], 5: ['#f7c600', '#1d1d1d'],
    6: ['#1a9a48', '#ffffff'], 7: ['#f07800', '#ffffff'], 8: ['#f58cb4', '#1d1d1d'], 9: ['#7b4fc4', '#ffffff'] };
  const TCOL = { '2車複': 'var(--t-q)', 'ワイド': 'var(--t-w)', '3連複': 'var(--t-f)', '2車単': 'var(--t-e)', '3連単': 'var(--t-t)' };
  const car = (n, big) => { const [bg, fg] = CAR[n] || ['#999', '#fff']; return `<span class="car${big ? ' big' : ''}" style="background:${bg};color:${fg}">${esc(n)}</span>`; };
  const combo = (bt, k, big) => { const sep = (bt === '2車単' || bt === '3連単') ? '→' : '='; return `<span class="combo">${String(k).split('-').map((n) => car(n, big)).join(`<span class="sep">${sep}</span>`)}</span>`; };
  const tbadge = (bt) => `<span class="tb" style="background:${TCOL[bt] || '#888'}">${esc(bt)}</span>`;
  // 1点の行: [組, 確率, 今のオッズ, 今のEV, 買い基準, 確定予想オッズ, 確定予想EV]（古いデータは5要素）
  // ワイドは [..., 最高倍率, その確定予想, その期待値] が続く（3着に誰が入るかで払戻が最低〜最高の間で変わる）
  const R = (x) => ({ k: x[0], p: x[1], od: x[2], ev0: x[3], line: x[4], of: x[5] ?? x[2], ev: x[6] ?? x[3],
    omax: x[7] ?? null, ofmax: x[8] ?? null, evmax: x[9] ?? null });
  const evRange = (ev, evmax) => evmax != null && evmax > ev + 0.005 ? `<span class="evb ${tier(evmax)}" style="padding:2px 5px">${ev.toFixed(2)}〜${evmax.toFixed(2)}</span>` : null;
  const oddsCell = (od, of) => (of != null && Math.abs(of - od) >= 0.05) ? `<b>${x1(od)}</b><span class="muted">→${x1(of)}</span>倍` : `<b>${x1(od)}</b>倍`;
  const tier = (ev) => ev >= 1.3 ? 's' : ev >= 1.1 ? 'a' : ev >= 1.0 ? 'b' : 'c';
  const TIER_LABEL = { s: '◎強く推奨', a: '○推奨', b: '△注目', c: '' };
  // 期待値は2つを分けて出す: 「今のオッズ」での期待値（参考）と、「確定予想」（締切後の下落を見込んだ倍率）での期待値（判定に使う）
  const rng = (a, b, f) => (b != null && b > a + 1e-9 ? `${f(a)}〜${f(b)}` : f(a));
  const f2 = (v) => v.toFixed(2);
  function evTwo(p, od, of, omax, ofmax) {
    const evNow = p * od, evNowMax = omax ? p * omax : null;
    const evFin = p * (of ?? od), evFinMax = omax ? p * (ofmax ?? omax) : null;
    return `<div class="ev2">
      <div class="ev2row"><span class="ev2lab">今のオッズ</span><b>${rng(od, omax, x1)}倍</b><span class="ev2now">EV ${rng(evNow, evNowMax, f2)}</span></div>
      <div class="ev2row"><span class="ev2lab fin">確定予想</span><b>${rng(of ?? od, omax ? (ofmax ?? omax) : null, x1)}倍</b><span class="evb ${tier(evFin)}">EV ${rng(evFin, evFinMax, f2)}</span></div></div>`;
  }
  const tierPill = (ev) => { const t = tier(ev); return TIER_LABEL[t] ? `<span class="evb ${t}">${TIER_LABEL[t]}</span>` : ''; };
  // 買い基準（今のオッズ）が今の1.5倍を超える時は、締切までにそこまで上がることはまず無いので数字を出さない
  // 推奨の条件（REC2）: 100倍以下・確定予想の期待値2.0以下・強い1番人気（1着45%以上）のレースは1番人気を含む組だけ
  const REC_ODDS_MAX = 100, REC_EV_MAX = 2.0, FAV_MIN = 0.45;
  const favOf = (win) => { const e = Object.entries(win || {}).sort((a, b) => b[1] - a[1])[0]; return e && e[1] >= FAV_MIN ? String(e[0]) : null; };
  const recOk = (k, od, ev, fav) => od <= REC_ODDS_MAX && ev <= REC_EV_MAX && (!fav || String(k).split('-').includes(fav));
  const reach = (line, od) => line != null && od > 0 && line <= od * 1.5;
  const evb = (ev) => { const t = tier(ev); return `<span class="evb ${t}">${TIER_LABEL[t] ? TIER_LABEL[t] + ' ' : ''}EV ${ev.toFixed(2)}</span>`; };

  async function deriveKey(pw, meta) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(meta.salt), iterations: meta.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }
  async function decrypt(buf) {
    const u = new Uint8Array(buf);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12) }, st.key, u.slice(12));
    const ds = new Blob([plain]).stream().pipeThrough(new DecompressionStream('deflate'));
    return JSON.parse(await new Response(ds).text());
  }
  async function latestSha() {
    const url = `https://api.github.com/repos/${OWNER}/${REPO}/branches/${BRANCH}`;
    let r = await fetch(url, { cache: 'no-store', headers: st.tok ? { Authorization: `Bearer ${st.tok}` } : {} });
    if (st.tok && (r.status === 401 || r.status === 403)) r = await fetch(url, { cache: 'no-store' });  // トークンが切れていても読めるように
    if (!r.ok) throw new Error('データがまだありません（' + r.status + '）');
    return (await r.json()).commit.sha;
  }
  const raw = (name) => fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/${st.sha}/${name}`);
  async function getEnc(name) { const r = await raw(name); if (!r.ok) throw new Error(name + ' ' + r.status); return decrypt(await r.arrayBuffer()); }

  async function load(pw) {
    const sha = await latestSha();
    if (!pw && st.index && sha === st.sha) return false;  // 変わっていなければ取り直さない
    st.sha = sha;
    const meta = await (await raw('meta.json')).json();
    if (!st.key || !st.meta || st.meta.salt !== meta.salt) { st.key = await deriveKey(pw || st.pw, meta); st.meta = meta; }
    st.index = await getEnc('index.enc');
    if (st.race) { try { st.raceData = await getEnc(st.race + '.enc'); } catch (e) { /* まだ記録なし */ } }
  }


  // ================================================================ 資金管理（賭けた記録は非公開の datebase に保存）
  const DATA_REPO = 'datebase';
  // 資金管理の「＋買い目を追加」の入力（追加の後も残す。組だけ空にする）
  const MF = { date: '', venue: '23', rn: '1', bt: '2車複', key: '', stake: '100', msg: '' };
  const INP = 'display:block;width:100%;margin-top:4px;padding:8px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)';
  const VENUES = { 11: '函館', 12: '青森', 13: 'いわき平', 21: '弥彦', 22: '前橋', 23: '取手', 24: '宇都宮', 25: '大宮', 26: '西武園', 27: '京王閣', 28: '立川', 31: '松戸', 32: '千葉', 34: '川崎', 35: '平塚', 36: '小田原', 37: '伊東', 38: '静岡', 42: '名古屋', 43: '岐阜', 44: '大垣', 45: '豊橋', 46: '富山', 47: '松阪', 48: '四日市', 51: '福井', 53: '奈良', 54: '向日町', 55: '和歌山', 56: '岸和田', 61: '玉野', 62: '広島', 63: '防府', 71: '高松', 73: '小松島', 74: '高知', 75: '松山', 81: '小倉', 83: '久留米', 84: '武雄', 85: '佐世保', 86: '別府', 87: '熊本' };
  const DEF_SET = { initial: 30000, stake: 100, evRec: 1.10, dayLoss: 3000, raceMax: 500 };
  const todayJST = () => new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Tokyo' }));
  const ymd = (d) => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
  // トークンは、サイトのパスワードから作った鍵で暗号化して端末に保存する
  async function tokKey() {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(st.pw || ''), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: new TextEncoder().encode('kb-token-v1'), iterations: 100000, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function saveTok(t) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const c = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await tokKey(), new TextEncoder().encode(t)));
    store.set('kb_tok', btoa(String.fromCharCode(...iv, ...c)));
    st.tok = t;
  }
  async function loadTok() {
    const v = store.get('kb_tok');
    if (!v) return null;
    try {
      const u = b64(v);
      st.tok = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12) }, await tokKey(), u.slice(12)));
    } catch (e) { st.tok = null; }
    return st.tok;
  }

          <label>組（例 2-134 / 3-1-456）<span style="display:flex;gap:6px;margin-top:4px"><input id="m_key" inputmode="decimal" autocomplete="off" placeholder="2-134 または 2.134" value="${esc(MF.key)}" style="${INP};margin-top:0;flex:1"><button type="button" id="m_dash" class="more" style="padding:0 12px;font-size:20px;border:1px solid var(--line);border-radius:8px">－</button></span></label>
          <label>1点の金額（円）<input id="m_stake" type="number" min="100" step="100" value="${esc(MF.stake)}" style="${INP}"></label>
        </div>

        <button id="m_add" class="betbtn" style="width:100%;margin-top:10px">追加する</button><div class="err" id="m_err"></div>
        ${MF.msg ? `<div class="pill good" style="margin-top:6px">✅ ${esc(MF.msg)}</div>` : ''}</div>
      <div class="card"><h2 style="margin-top:0">履歴</h2><div class="scroll"><table><tr><th>レース・買い目</th><th>金額</th><th>オッズ</th><th>結果</th></tr>${rows || '<tr><td colspan="4" class="muted">まだ記録がありません</td></tr>'}</table></div></div></main>`;
    bindBack(); bindBoard();
    // 入力した値は追加の後も残す（同じレースの買い目を続けて入れられるように）
    const readMF = () => {
      MF.date = document.getElementById('m_date').value; MF.venue = document.getElementById('m_venue').value;
      MF.rn = document.getElementById('m_rn').value; MF.bt = document.getElementById('m_bt').value;
      MF.key = document.getElementById('m_key').value; MF.stake = document.getElementById('m_stake').value;
    };
    const preview = () => {
      readMF();
      const { keys, err } = expandKeys(MF.bt, MF.key);
      const stake = Math.round((parseInt(MF.stake, 10) || 0) / 100) * 100;
      document.getElementById('m_prev').innerHTML = err ? `<span style="color:var(--bad)">${esc(err)}</span>` : keys.length
        ? `→ <b>${keys.length}点</b>（合計 ${yen(stake * keys.length)}）: ${keys.slice(0, 30).map((k) => esc(k)).join('・')}${keys.length > 30 ? ' ほか' : ''}` : '';
    };
    ['m_date', 'm_venue', 'm_rn', 'm_bt', 'm_key', 'm_stake'].forEach((id) => { const el = document.getElementById(id); el.oninput = preview; el.onchange = preview; });
    // スマホの数字キーボードには「-」が無いので、「－」ボタンで入れる（「.」でも区切れる）
    document.getElementById('m_dash').onclick = (e) => { e.preventDefault(); const k = document.getElementById('m_key'); k.value += '-'; k.focus(); preview(); };
    preview();
    document.getElementById('m_add').onclick = async () => {
      readMF();
      const err = document.getElementById('m_err');
      const dt = MF.date.replace(/-/g, '');
      const vc = MF.venue, rn = +MF.rn, bt = MF.bt;
      if (!/^\d{8}$/.test(dt) || dt > ymd(todayJST())) { err.textContent = '日付を確かめてください（今日まで）'; return; }
      const { keys, err: kerr } = expandKeys(bt, MF.key);
      if (kerr || !keys.length) { err.textContent = kerr || '組を入力してください'; return; }
      const stake = Math.round((parseInt(MF.stake, 10) || 0) / 100) * 100;
      if (stake < 100) { err.textContent = '金額は100円以上'; return; }
      if (keys.length > 1 && !confirm(`${VENUES[vc]}${rn}R ${bt} ${keys.length}点（1点 ${yen(stake)}・合計 ${yen(stake * keys.length)}）を記録します。\n${keys.join('・')}`)) return;
      const race = `${String(rn).padStart(2, '0')}${vc}${dt}`;
      err.textContent = '記録中…';
      try {
        const ok = await placeBets(keys.map((key) => ({ race, venue: VENUES[vc], rn, bt, key, source: 'manual' })), stake, true);
        if (ok) { MF.key = ''; MF.msg = `${VENUES[vc]}${rn}R ${bt} ${keys.length}点を記録しました`; }
        render();
      } catch (e) { err.textContent = e.message; }
    };
    document.getElementById('saveset').onclick = async () => {
      const next = { ...set };
      app.querySelectorAll('[data-set]').forEach((i) => { next[i.dataset.set] = parseFloat(i.value); });
      try { await saveSettings(next); render(); } catch (e) { alert(e.message); }
    };
    document.getElementById('forget').onclick = () => { if (confirm('この端末に保存したトークンを消しますか？')) { store.del('kb_tok'); st.tok = null; st.bank = null; render(); } };
  }


  // ================================================================ 毎朝の検証レポート（analysis/daily_report.py）
  const pc = (v) => v == null ? '-' : (v * 100).toFixed(1) + '%';
  function sumCells(s) { return `<td>${s.n}</td><td>${s.hits}</td><td><b>${pc(s.roi)}</b></td><td class="muted">${s.n ? pc(s.lo) + '〜' + pc(s.hi) : '-'}</td><td>${s.n ? (s.ret - s.stake >= 0 ? '+' : '') + yen(s.ret - s.stake) : '-'}</td>`; }

    const srows = (R.strategies || []).filter((s) => s.all.n || s.id === 'REC').map((s) => `<tr><td class="wrap"><b>${esc(s.id)}</b><div class="muted" style="font-size:12px">${esc(s.label)}</div></td>${sumCells(s.all)}<td>${pc(s.week.roi)}<div class="muted">${s.week.n}点</div></td></tr>`).join('');
    const m = R.mine || {}, rec = (R.strategies || []).find((s) => s.id === 'REC') || { all: {}, week: {} };
    const cal = Object.entries((R.calib || {}).all || {}).map(([k, [n, ep, hit, z]]) => `<tr><td>${esc(k.replace('|', ' '))}</td><td>${n.toLocaleString()}</td><td>${ep}</td><td>${hit}</td><td class="${Math.abs(z) >= 3 ? 'bad' : ''}">${z >= 0 ? '+' : ''}${z.toFixed(1)}</td></tr>`).join('');

    app.innerHTML = head + `<main>
      <div class="card" style="border:2px solid ${alerts ? 'var(--bad)' : 'var(--good)'}"><h2 style="margin-top:0">${alerts ? '⚠ 確認が必要なこと' : '✅ 異常なし'}</h2>
        ${alerts ? `<ul>${alerts}</ul>` : '<div class="muted">予想の確率・記録・精算に、運では説明できないずれはありません。ロジックはこのまま。</div>'}
        ${notes ? `<ul class="muted">${notes}</ul>` : ''}<p class="note">${esc(R.rule || '')}</p><div class="muted">作成 ${esc(R.generated || '')}・${R.days}日分（${esc(R.first || '')}〜${esc(R.last || '')}）</div></div>
      <div class="card"><h2 style="margin-top:0">${esc(String(y.date || '').slice(4, 6))}/${esc(String(y.date || '').slice(6))} の推奨（締切2分前の判定）</h2>
        <div class="mini"><span class="pill">判定 ${y.races || 0}レース</span><span class="pill">推奨 ${ys.n || 0}点</span><span class="pill good">的中 ${ys.hits || 0}</span><span class="pill done">回収率 ${pc(ys.roi)}</span></div>
        <div class="scroll"><table class="rep"><tr><th>レース</th><th>買い目</th><th>オッズ</th><th>EV</th><th>結果</th></tr>${yrows || '<tr><td colspan="5" class="muted">推奨はありませんでした（見送り）</td></tr>'}</table></div></div>
      <div class="card"><h2 style="margin-top:0">推奨を全部買った場合 と 実際に賭けた分</h2>
        <div class="scroll"><table class="rep"><tr><th></th><th>点数</th><th>的中</th><th>回収率</th><th>90%区間</th><th>収支</th></tr>
          <tr><td>推奨を全部・累計</td>${sumCells(rec.all)}</tr><tr><td>賭けた分・累計</td>${sumCells(m.all || {})}</tr>
          <tr><td>推奨を全部・7日</td>${sumCells(rec.week)}</tr><tr><td>賭けた分・7日</td>${sumCells(m.week || {})}</tr></table></div>
        <div class="muted">推奨にない買い目の記録: ${m.off_recs || 0}点</div></div>
      <div class="card"><h2 style="margin-top:0">事前登録した買い方（締切2分前・1点100円）</h2>
        <div class="scroll"><table class="rep"><tr><th>買い方</th><th>点数</th><th>的中</th><th>回収率</th><th>90%区間</th><th>収支</th><th>直近7日</th></tr>${srows}</table></div>
        <p class="note">点数が数百になるまでは運で大きく上下します。90%区間の下限が100%を超えて初めて「勝てる」と言えます。</p></div>
      <div class="card"><h2 style="margin-top:0">予想の確率の当たり方（累計）</h2>
        <div class="scroll"><table class="rep"><tr><th>券種・期待値の帯</th><th>組数</th><th>予想の的中</th><th>実際</th><th>z</th></tr>${cal || '<tr><td colspan="5" class="muted">まだデータがありません</td></tr>'}</table></div>
        <div class="muted">z が ±3 を超えたら、運ではなく予想のずれ（⚠ に出ます）。2車複の的中組の当たり方 オッズとの差: ${ll.diff == null ? '-' : (ll.diff > 0 ? '+' : '') + ll.diff}（z=${ll.z == null ? '-' : ll.z}、${ll.n || 0}R。マイナスほどオッズより良い）</div></div>
    </main>`;
    bindBack();
  }

  // ---- ログイン
  function loginView(msg) {
    app.innerHTML = `<div class="login card"><h1 style="font-size:18px;margin:0 0 8px">期待値ボード</h1>
      <p class="muted">個人閲覧用です。パスワードを入力してください（このページの中だけで復号します）。</p>
      <input id="pw" type="password" autocomplete="current-password" placeholder="パスワード">
      <label class="muted" style="display:block;margin-top:8px"><input id="keep" type="checkbox"> この端末に保存する</label>
      <button id="go">開く</button><div class="err" id="err">${esc(msg || '')}</div></div>`;
    const go = async () => {
      const pw = document.getElementById('pw').value;
      document.getElementById('err').textContent = '読み込み中…';
      try {
        st.pw = pw; st.key = null; await load(pw);
        if (document.getElementById('keep').checked) store.set('kb_pw', pw);
        await afterLogin();
      } catch (e) {
        document.getElementById('err').textContent = (e.name === 'OperationError') ? 'パスワードが違います' : ('読み込めません: ' + e.message);
      }
    };
    document.getElementById('go').onclick = go;
    document.getElementById('pw').onkeydown = (e) => { if (e.key === 'Enter') go(); };
  }

  async function afterLogin() {
    startRefresh(); render();
    if (await loadTok()) { try { await loadBank(); render(); } catch (e) { /* 次回 */ } }
  }
  function startRefresh() {
    clearTimeout(st.timer);
    const tick = async () => {
      try {
        await load();
        // 資金管理: 結果待ちがある間は1分ごと、無ければ10分ごとに読み直す（レースごとに精算が反映される）
        const waiting = st.bank && st.bank.bets.some((x) => !x.deleted && !st.bank.settled[x.id]);
        if (st.tok && (!st.bank || Date.now() - st.bank.at > (waiting ? 60 : 600) * 1000)) await loadBank();
        if (!document.querySelector('input:focus')) render();  // 締切までの残り時間も更新
      } catch (e) { /* 次回再試行 */ }
      st.timer = setTimeout(tick, REFRESH_SEC() * 1000);
    };
    st.timer = setTimeout(tick, REFRESH_SEC() * 1000);
  }

  // ---- 一覧
  // 一覧の日付（YYYYMMDD）の hh:mm まで、今（JST）から何分か。前日のデータなら負、翌日の予定なら大きな正の値
  function minutesTo(hhmm) {
    if (!hhmm) return null;
    const [h, m] = hhmm.split(':').map(Number);
    const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Tokyo' }));
    const d = String((st.index && st.index.date) || '');
    const day = /^\d{8}$/.test(d) ? new Date(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8)) : new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const t = new Date(day.getFullYear(), day.getMonth(), day.getDate(), h, m);
    return Math.round((t - now) / 60000 + now.getSeconds() / 60);
  }
  const untilLabel = (m) => m >= 60 ? `締切まで ${Math.floor(m / 60)}時間${m % 60 ? (m % 60) + '分' : ''}` : `締切まで ${m}分`;
  function dayBanner() {
    const d = String(st.index.date || ''), t = ymd(todayJST());
    if (!d || d === t) return '';
    const md = `${+d.slice(4, 6)}/${+d.slice(6, 8)}`;
    return d > t ? `<div class="card" style="border:2px solid #2f5bea">📅 <b>${md}（明日）のレース予定</b>です。オッズと期待値は、各レースの締切15分前から順に出ます。</div>`
      : `<div class="card" style="border:2px dashed var(--sub)">🕘 ${md} のデータです（終わったレース）。今日の予定は、取得され次第ここに出ます。</div>`;
  }
  function render() {
    if (st.page === 'bank') return bankView();
    if (st.page === 'report') return reportView();
    if (st.race) return renderRace();
    const races = Object.entries(st.index.races || {}).map(([id, r]) => ({ id, ...r }));
    const venues = [...new Set(races.map((r) => r.venue))];
    if (!st.venue || !venues.includes(st.venue)) {
      const next = races.filter((r) => (minutesTo(r.deadline || r.start) ?? -1) >= 0).sort((a, b) => a.start.localeCompare(b.start))[0];
      st.venue = next ? next.venue : venues[0];
    }
    const list = races.filter((r) => r.venue === st.venue).sort((a, b) => a.rn - b.rn);
    app.innerHTML = `<header><h1>期待値ボード <span class="upd">${esc(st.index.date)} 更新 ${esc((st.index.updated || '').slice(11, 19))} <button class="back" id="toreport" style="margin-left:8px">📊検証${st.index.report && st.index.report.alerts ? ' ⚠' : ''}</button><button class="back" id="tobank" style="margin-left:6px">💰資金管理</button></span></h1>
      <div class="tabs">${venues.map((v) => `<button class="tab ${v === st.venue ? 'on' : ''}" data-v="${esc(v)}">${esc(v)}${races.some((r) => r.venue === v && recCount(r) && (minutesTo(r.deadline || r.start) ?? -1) > 0) ? '<span class="dot"></span>' : ''}</button>`).join('')}</div></header>
      <main>${dayBanner()}${boardHtml()}<h2 style="margin-top:18px">🏟 ${esc(st.venue || '')} のレース</h2>${evControl()}${list.map(raceCard).join('') || '<p class="muted">この場のレースはまだありません。</p>'}
      <div class="card legend">${evb(1.35)}${evb(1.15)}${evb(1.03)}<span>EV＝当たる確率×今のオッズ。1.10以上が買いの目安</span></div>
      <p class="note">締切は発走の5分前です。締切2分前のオッズが最後の判断材料です。🔥＝2車複・ワイドで期待値1.10以上（事前登録の★・買い目群を含む）。
      2車複・ワイド以外は過去の検証で負けていたため参考表示です。緑の点が付いた場は、これから締切のおすすめがあります。</p></main>`;
    app.querySelectorAll('.tab').forEach((b) => b.onclick = () => { st.venue = b.dataset.v; render(); });
    bindEv();
    app.querySelectorAll('.race').forEach((c) => c.onclick = () => openRace(c.dataset.id));
    bindBoard();
    const tb = document.getElementById('tobank'); if (tb) tb.onclick = () => { st.page = 'bank'; render(); window.scrollTo(0, 0); };
    app.querySelectorAll('#toreport, .toreport').forEach((x) => x.onclick = () => { st.page = 'report'; st.report = null; render(); window.scrollTo(0, 0); });
  }
  function recCount(r) {
    if (!r.best) return 0;
    const singles = (r.best.rows || []).filter(([bt, k, od, ev]) => VALIDATED.has(bt) && ev >= 1.1).length;
    return (r.best.strat || 0) + (r.best.grp || 0) + singles;
  }
  function raceCard(r) {
    const m = minutesTo(r.deadline || r.start);
    const cls = m == null ? 'count past' : (m > 5 ? 'count' : (m > 0 ? 'count soon' : 'count past'));
    const when = m == null ? '' : (m > 0 ? untilLabel(m) : (minutesTo(r.start) > 0 ? '締切済み' : '発走済み'));
    const snaps = SNAPS.map((s) => `<span class="pill ${(r.snaps || []).includes(s) ? 'done' : 'off'}">${SNAP_LABEL[s].replace('締切', '')}</span>`).join('');
    const n = recCount(r);
    const top = r.best ? Math.max(...(r.best.rows || []).filter(([bt]) => VALIDATED.has(bt)).map((x) => x[3]), 0) : 0;
    const hot = n ? (top >= 1.3 ? 'gold' : 'hot') : '';
    const badge = !r.best ? '' : (n ? `<span class="pill good">🔥 おすすめあり</span>` : '<span class="pill off">見送り</span>');
    const shownBest = r.best ? r.best.rows.filter(([bt, k, od, ev]) => VALIDATED.has(bt) && ev >= st.evMin) : [];
    const best = r.best ? (!shownBest.length ? `<div class="muted" style="margin-top:4px">期待値${st.evMin}以上の組はありません（${SNAP_LABEL[r.best.snap] || ''}時点）</div>` : `<div class="mini">${shownBest.map(([bt, k, od, ev, of]) =>
      `${tbadge(bt)} ${combo(bt, k)} <span class="muted">${oddsCell(od, of)}</span> ${evb(ev)}`).join('<span style="width:100%"></span>')}</div>
      <div class="muted" style="margin-top:4px">${SNAP_LABEL[r.best.snap] || ''}時点・2車複/ワイドで期待値が最も高い組</div>`) : '<div class="muted" style="margin-top:4px">まだ記録がありません</div>';
    return `<div class="card race ${hot}" data-id="${esc(r.id)}"><div class="top"><span class="ttl">${r.rn}R <span class="muted" style="font-weight:normal">締切 ${esc(r.deadline || '-')}・発走 ${esc(r.start)}</span></span>
      <span class="${cls}">${when}</span></div><div style="margin-top:6px">${badge}${snaps}</div>${best}</div>`;
  }

  // ---- レース詳細
  async function openRace(id) {
    st.race = id; st.raceData = null; st.snap = null; st.snapPicked = false; st.showAll = {};
    try { st.raceData = await getEnc(id + '.enc'); } catch (e) { /* noop */ }
    render(); window.scrollTo(0, 0);
  }
  function renderRace() {
    const d = st.raceData;
    const head = `<header><h1><button class="back" id="back">← 一覧</button><span class="upd">${esc(st.index.date)}</span></h1></header>`;
    if (!d) { app.innerHTML = head + '<main><p class="muted">まだ記録がありません。</p></main>'; return bindBack(); }
    const have = SNAPS.filter((s) => d.snaps[s]);
    if (!st.snap || !d.snaps[st.snap] || !st.snapPicked) st.snap = have[have.length - 1];  // 自分で選んでいなければ常に一番新しい時点
    const s = d.snaps[st.snap];
    const riders = (d.riders || []).map(([c, n, p, pt, sty]) => `<span>${car(c)} ${esc(n)} <span style="opacity:.8">${esc(p)}・${esc(pt)}・${esc(sty)}</span></span>`).join('');
    const wins = Object.entries(s.win || {}).sort((a, b) => b[1] - a[1]);
    const win = `<div class="winbar">${wins.map(([c, p]) => `<span title="${c}番 ${pct(p)}" style="width:${p * 100}%;background:${(CAR[c] || ['#999'])[0]};${c == 1 ? 'box-shadow:inset 0 0 0 1px #bbb' : ''}"></span>`).join('')}</div>
      <div class="mini">${wins.slice(0, 4).map(([c, p]) => `${car(c)} <b>${pct(p)}</b>`).join(' ')}<span class="muted">← 1着の確率</span></div>`;
    const strat = hero(s);
    const view = st.view || 'single';
    const tables = view === 'group' ? groupSection(s.groups || {}) : TYPES.map((bt) => typeTable(bt, s.types[bt] || [])).join('');
    app.innerHTML = head + `<main><div class="card"><div class="ttl" style="font-size:20px">${esc(d.venue)} ${d.rn}R <span class="muted" style="font-weight:normal">締切 ${esc(d.deadline || '-')}・発走 ${esc(d.start)}</span></div>
      <div class="riders">${riders}</div>
      <div class="seg">${SNAPS.map((x) => `<button data-s="${x}" ${d.snaps[x] ? '' : 'disabled'} class="${x === st.snap ? 'on' : ''}">${SNAP_LABEL[x]}</button>`).join('')}</div>
      <div class="muted">取得 ${esc(s.at)} ／ ${s.market_ok ? 'オッズと融合済み' : '<span style="color:var(--bad);font-weight:700">3連単オッズ不足（参考値）</span>'}</div>
      ${win}${riderMemo(s)}
      <div class="seg" id="view"><button data-v="single" class="${view === 'single' ? 'on' : ''}">1点ごと</button>
      <button data-v="group" class="${view === 'group' ? 'on' : ''}">買い目群（合成オッズ）</button></div>${evControl()}</div>${strat}${tables}
      <p class="note">期待値＝当たる確率×オッズ。「今のオッズ」の期待値は参考、<b>判定は「確定予想」（締切後の下落を過去の記録から見込んだ倍率）の期待値</b>。ワイドは最低倍率。「買い基準」＝<b>今のオッズ</b>がこの倍率以上なら、確定予想（締切後の下落を見込んだ倍率）での期待値が1.10以上。表示は「表示する期待値」以上・確率0.5%以上・300倍以下（「全○組を表示」で全部）。</p></main>`;
    bindBack();
    app.querySelectorAll('.seg button[data-s]').forEach((b) => b.onclick = () => { st.snap = b.dataset.s; st.snapPicked = b.dataset.s !== 'LIVE'; render(); });
    bindAddBet();
    bindEv();
    app.querySelectorAll('#view button').forEach((b) => b.onclick = () => { st.view = b.dataset.v; store.set('kb_view', st.view); render(); });
    app.querySelectorAll('.more').forEach((b) => b.onclick = () => { st.showAll[b.dataset.t] = !st.showAll[b.dataset.t]; render(); });
  }
  // おすすめ（2車複・ワイドで期待値1.10以上: ★事前登録・1点・買い目群）を大きく表示。無ければ「見送り」と、あと何倍で買いか
  function hero(s) {
    const recs = [];
    const seen = new Set();
    const fav = favOf(s.win);
    let dropped = 0;
    const rowOf = (bt, k) => { const x = (s.types[bt] || []).find((r) => r[0] === k); return x ? R(x) : null; };
    (s.strat || []).forEach(([id, lab, bt, k, od, ev, line]) => {
      // 事前登録の買い方は「今のオッズでの期待値」で該当を判定している（検証の条件は変えない）。
      // おすすめに出すのは、確定予想（締切後の下落を見込む）でも期待値1.10以上のものだけ
      const r = rowOf(bt, k);
      if (!r || r.ev < 1.1) return;
      if (!recOk(k, r.od, r.ev, fav)) { dropped++; return; }
      seen.add(bt + k);
      recs.push({ kind: '★ 事前登録', bt, keys: [k], od, of: r.of, ev: r.ev, line: r.line, P: r.p, lab, omax: r.omax, ofmax: r.ofmax, evmax: r.evmax });
    });
    for (const bt of VALIDATED) {
      (s.types[bt] || []).map(R).filter(({ k, p, od, ev }) => ev >= 1.1 && p >= 0.005 && od <= 300 && !seen.has(bt + k) && (recOk(k, od, ev, fav) || (dropped++, false))).slice(0, 3)
        .forEach(({ k, p, od, ev, line, of, omax, ofmax, evmax }) => recs.push({ kind: '1点', bt, keys: [k], od, of, ev, line, P: p, omax, ofmax, evmax }));
      const g = (s.groups || {})[bt];
      if (g) {
        [...(g.ev || []), ...(g.hit || [])].forEach((r) => {
          const [lab, n, P, syn, ev, evr, st2, cut, n2, P2, syn2, ev2, evr2, st3] = r;
          if (n < 2) return;
          const keysOk = (ks, e) => e <= REC_EV_MAX && (!fav || ks.every((x) => String(x[0]).split('-').includes(fav)));
          if ((cut && ev2 >= 1.1 && !keysOk(st3, ev2)) || (!cut && ev >= 1.1 && !keysOk(st2, ev))) { dropped++; return; }
          if (cut && ev2 >= 1.1) recs.push({ kind: '買い目群（✂切り）', bt, keys: st3.map((x) => x[0]), od: syn2, ev: ev2, P: P2, lab: lab + ' から ' + cut.map((k) => fmtKey(bt, k)).join('・') + ' を切る', group: true });
          else if (ev >= 1.1) recs.push({ kind: '買い目群', bt, keys: st2.map((x) => x[0]), od: syn, ev, P, lab, group: true });
        });
      }
    }
    const uniq = [];
    const sig = new Set();
    recs.sort((a, b) => b.ev - a.ev).forEach((r) => { const k = r.bt + r.keys.slice().sort().join(','); if (!sig.has(k)) { sig.add(k); uniq.push(r); } });
    if (!uniq.length) {
      const near = [];
      for (const bt of VALIDATED) (s.types[bt] || []).filter(([k, p, od]) => p >= 0.03 && od <= 300).slice(0, 2).forEach((x) => { const r = R(x); near.push([bt, r.k, r.p, r.od, r.ev, r.line, r.of]); });
      near.sort((a, b) => b[4] - a[4]);
      return `<div class="card skip"><div class="th2">⏸ 今は見送り <span class="muted" style="font-weight:normal">2車複・ワイドで期待値1.10以上の買い目がありません</span></div>
        ${dropped ? `<div class="note">⚠ 期待値1.10以上でも、100倍超・期待値2.0超（売れていない組のゆがみの可能性）・強い1番人気に逆らう組の ${dropped}件は、過去の検証で勝てていないため除外しました。</div>` : ''}
        ${near.slice(0, 3).map(([bt, k, p, od, ev, line, of]) => `<div class="rec c" style="margin:6px 0"><div>${tbadge(bt)} ${combo(bt, k)}
          <div class="muted" style="margin-top:4px">${reach(line, od) ? `今のオッズが <b>${x1(line)}倍以上</b>なら買い` : 'この時点では買い基準に届かない'}</div></div>
          <div></div><div class="line2">${evTwo(p, od, of, null, null)}</div></div>`).join('')}
        ${['C-15', 'C-10'].includes(st.snap) ? '<div class="note">締切15・10分前のオッズは締切までに大きく動き、割安に見える組ほど下がるため、この時点ではほとんど届きません。締切5分前・2分前（最新）で判断してください。</div>' : ''}</div>`;
    }
    const early = ['C-15', 'C-10'].includes(st.snap);
    return `<div class="card hero"><h2>🔥 おすすめの買い目 <span class="muted" style="font-weight:normal">（${esc(SNAP_LABEL[st.snap] || '')}のオッズ${early ? '・参考' : ''}）</span></h2>
      ${early ? '<div class="note" style="margin-top:0">締切15・10分前のオッズは締切までに大きく動くため参考です。判定は締切5分前・2分前（最新）で。</div>' : ''}
      ${fav ? `<div class="mini"><span class="pill">強い1番人気 ${car(fav)}（1着 ${pct((s.win || {})[fav])}）→ ${fav}番を含む組だけ</span></div>` : ''}
      ${uniq.slice(0, 6).map((r) => { const t = tier(r.ev); return `<div class="rec ${t}">
        <div>${tbadge(r.bt)} <span class="pill ${r.kind.startsWith('★') ? 'good' : ''}">${esc(r.kind)}</span>
          <div style="margin-top:6px" class="combos">${r.group ? r.keys.slice(0, 8).map((k) => combo(r.bt, k)).join('') + (r.keys.length > 8 ? ` <span class="muted">ほか${r.keys.length - 8}点</span>` : '') : combo(r.bt, r.keys[0], true)}</div></div>
        <div style="text-align:right">${r.group ? `${evb(r.ev)}<div class="buy">合成 ${x1(r.od)}倍</div><div class="muted" style="font-size:11px">確定予想での期待値</div>` : tierPill(r.ev)}</div>
        ${r.group ? '' : `<div class="line2">${evTwo(r.P, r.od, r.of, r.omax, r.ofmax)}</div>`}
        <div class="line2">${r.group ? `${r.keys.length}点・的中 ${pct(r.P)}・${esc(r.lab)}` : `当たる確率 ${r.P != null ? pct(r.P) : '-'}・今のオッズが<b>${x1(r.line)}倍以上なら買い</b>${r.lab ? '・' + esc(r.lab) : ''}`}</div>
        ${whyHtml(s, r)}
      </div>`; }).join('')}
      ${dropped ? `<div class="note">⚠ ほかに ${dropped}件（100倍超・期待値2.0超・強い1番人気に逆らう組）は、過去の検証で勝てていないため除外しました。</div>` : ''}
      <div class="muted">1点100円など少額・一定額で。締切直前にもう一度倍率を確認し、基準を下回ったら見送り。</div></div>`;
  }
  // 「なぜこの買い目か」: 買い目の説明と、関わる選手のメモ
  function whyHtml(s, r) {
    const w = s.why || {};
    const tk = r.group ? [] : ((w.tickets || {})[r.bt + '|' + r.keys[0]] || []);
    const cars = [...new Set(r.keys.flatMap((k) => k.split('-')))].slice(0, 4);
    const rn = cars.map((c) => [c, (w.riders || {})[c] || []]).filter(([, v]) => v.length);
    if (!tk.length && !rn.length) return '';
    return `<details class="line2" style="grid-column:1/-1"><summary style="cursor:pointer;color:var(--accent);font-weight:700">💡 なぜこの買い目？</summary>
      ${tk.length ? `<ul style="margin:6px 0 4px;padding-left:18px">${tk.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      ${rn.map(([c, v]) => `<div style="display:flex;gap:8px;align-items:flex-start;margin-top:4px">${car(c)}<span style="flex:1">${v.map(esc).join(' ／ ')}</span></div>`).join('')}</details>`;
  }
  function riderMemo(s) {
    const rs = (s.why || {}).riders || {};
    const ks = Object.keys(rs).filter((k) => rs[k].length).sort((a, b) => a - b);
    if (!ks.length) return '';
    return `<details style="margin-top:6px"><summary style="cursor:pointer;color:var(--accent);font-weight:700">📝 選手メモ（得点・脚質・コメント・並び・関係）</summary>
      ${ks.map((c) => `<div style="display:flex;gap:8px;align-items:flex-start;margin-top:6px;font-size:13px">${car(c)}<span style="flex:1">${rs[c].map(esc).join(' ／ ')}</span></div>`).join('')}</details>`;
  }
  // レース画面の各組の［賭けた］（締切後・過去のレースも記録できる）
  function betCell(bt, k, x) {
    const d = st.raceData || {};
    const done = betOf(st.race, bt, k);
    if (done) return `<span title="${esc(yen(done.stake))}">✅</span>`;
    const rec = { race: st.race, venue: d.venue, rn: d.rn, deadline: d.deadline, bt, key: k, od: x.od, of: x.of, ev: x.ev, p: x.p, snap: st.snap, source: 'race' };
    return `<button class="addbet" data-rec="${esc(JSON.stringify(rec))}">賭けた</button>`;
  }
  function bindAddBet() {
    app.querySelectorAll('.addbet').forEach((b) => b.onclick = async (e) => {
      e.stopPropagation();
      const rec = JSON.parse(b.dataset.rec);
      const v = prompt(`${rec.venue}${rec.rn}R ${rec.bt} ${rec.key} に賭けた金額（円）`, String(stakeOf()));
      if (v == null) return;
      const stake = Math.round((parseInt(v, 10) || 0) / 100) * 100;
      if (stake < 100) { alert('100円以上で入力してください'); return; }
      b.disabled = true; b.textContent = '記録中…';
      try { await placeBet(rec, stake); } catch (err) { alert(err.message); b.disabled = false; b.textContent = '賭けた'; }
    });
  }
  function typeTable(bt, rows) {
    if (!rows.length) return `<div class="card"><div class="th2" style="margin:0">${tbadge(bt)} <span class="muted" style="font-weight:normal">この時点のオッズがありません</span></div></div>`;
    const all = !!st.showAll[bt];
    const shown = (all ? rows : rows.filter((x) => x[1] >= 0.005 && x[2] <= 300 && R(x).ev >= st.evMin).slice(0, 15)).map(R);
    const tag = VALIDATED.has(bt) ? '<span class="pill good">検証済み</span>' : '<span class="pill warn">参考</span>';
    return `<div class="card" style="border-top:4px solid ${TCOL[bt]}"><div class="th2">${tbadge(bt)} ${tag}<span class="muted" style="font-weight:normal">期待値の高い順</span></div>
      <div class="scroll"><table><tr><th>組</th><th>確率</th><th>今のオッズ<div class="muted" style="font-weight:normal">倍・EV（参考）</div></th><th>確定予想<div class="muted" style="font-weight:normal">倍・EV（判定）</div></th><th>買い基準<div class="muted" style="font-weight:normal">今のオッズ</div></th><th></th></tr>
      ${shown.length ? '' : `<tr><td colspan="6" class="muted">確定予想の期待値${st.evMin}以上の組はありません</td></tr>`}
      ${shown.map(({ k, p, od, ev, line, of, omax, ofmax, evmax }) => `<tr class="${VALIDATED.has(bt) && ev >= 1.1 && p >= 0.005 && od <= 300 ? 'buy' + (ev >= 1.3 ? ' s' : '') : ''}">
        <td>${combo(bt, k)}</td><td>${pct(p)}</td>
        <td><b>${rng(od, omax, x1)}</b>倍<div class="ev2now">EV ${rng(p * od, omax ? p * omax : null, f2)}</div></td>
        <td><b>${rng(of, omax ? ofmax : null, x1)}</b>倍<div>${evRange(ev, evmax) || evb(ev).replace(/◎強く推奨 |○推奨 |△注目 /, '')}</div></td>
        <td>${reach(line, od) || ev >= 1.1 ? x1(line) + '倍' : '<span class="muted">届かない</span>'}</td><td>${betCell(bt, k, { od, of, ev, p })}</td></tr>`).join('')}</table></div>
      <button class="more" data-t="${esc(bt)}">${all ? '上位だけ表示' : `全${rows.length}組を表示`}</button></div>`;
  }
  function groupSection(groups) {
    const types = TYPES.filter((bt) => groups[bt]);
    if (!types.length) return '<div class="card muted">この時点では買い目群を計算できません（3連単オッズ不足）。</div>';
    const head = `<div class="card"><div class="muted">流し・フォーメーション・BOX・ライン決着と、その組み合わせ（例: 1→2→345 ＋ 4→5→136）の候補から、合成オッズでの期待値が高い順に表示します。
      合成オッズ＝1÷Σ(1÷各点のオッズ)。どれが当たっても払戻がほぼ同じになるよう、オッズに反比例して賭けた場合の倍率です
      （ワイドは各点100円の同額買い）。期待値＝的中率×合成オッズ。✂は「期待値の低い買い目を切ると期待値が上がる」提案です（的中率の下限は守ります）。<b>過去の検証では、買い目群は1点買いと同じくらいの成績で、
      利益を増やすものではありません</b>（当たりやすさと払戻の安定が変わります）。3連単の流しで期待値1.10を超える組は過去にほぼありませんでした。</div></div>`;
    return head + types.map((bt) => {
      const g = groups[bt];
      const tag = bt === '2車複' ? '<span class="pill">検証中</span>' : '<span class="pill warn">参考</span>';
      const detail = (n, P, syn, ev, evr, st2) => `
        <div class="scroll"><table><tr><th>買い目</th><th>確率</th><th>オッズ</th><th>この点のEV</th><th>配分</th></tr>
        ${st2.map(([k, stake, od, p1, ev1]) => `<tr><td>${combo(bt, k)}</td><td>${p1 != null ? pct(p1) : '-'}</td><td>${x1(od)}倍</td>
          <td>${ev1 != null ? evb(ev1).replace(/◎強く推奨 |○推奨 |△注目 /, '') : '-'}</td><td><b>${stake}</b>円</td></tr>`).join('')}</table></div>
        <div class="muted">100円単位に丸めた配分での期待値 ${evr.toFixed(2)}</div>`;
      const sumLine = (n, P, syn, ev) => `的中 <b>${pct(P)}</b> ・ ${syn ? '合成 <b>' + syn.toFixed(1) + '</b>倍' : '同額'} ${evb(ev)}`;
      const list = (rows0, title) => { const rows = rows0.filter((r) => Math.max(r[4], r.length > 11 ? r[11] : 0) >= st.evMin);
        return !rows.length ? `<h2>${title}</h2><div class="muted">期待値${st.evMin}以上の買い目群はありません</div>` : `<h2>${title}</h2>${rows.map((r) => {
        const [lab, n, P, syn, ev, evr, st2, cut, n2, P2, syn2, ev2, evr2, st3] = r;
        const best = cut ? Math.max(ev, ev2) : ev;
        const cutHtml = cut ? `<div class="cut">
          ✂ <span class="combos" style="display:inline-flex">${cut.map((k) => combo(bt, k)).join('')}</span> を切ると ${n2}点・${sumLine(n2, P2, syn2, ev2)}
          ${ev2 >= 1.0 && ev < 1.0 ? '<span class="pill good">100%超え</span>' : ''}</div>` : '';
        const more = `<details style="margin-top:4px"><summary class="muted" style="cursor:pointer">買い目ごとの期待値と配分を見る（1000円）</summary>
          ${cut ? '<div class="muted" style="margin-top:4px">切った後</div>' + detail(n2, P2, syn2, ev2, evr2, st3) + '<div class="muted" style="margin-top:6px">切る前</div>' : ''}
          ${detail(n, P, syn, ev, evr, st2)}</details>`;
        return `<div class="grp ${best >= 1.3 ? 's' : (best >= 1.1 ? 'a' : '')}">
          <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap">
          <span><b>${esc(lab)}</b> <span class="muted">${n}点</span></span><span>${sumLine(n, P, syn, ev)}</span></div>
          ${cutHtml}${more}</div>`;
      }).join('')}`; };
      return `<div class="card" style="border-top:4px solid ${TCOL[bt]}"><div class="th2">${tbadge(bt)} ${tag}</div>${list(g.ev, '💰 期待値重視（的中率10%以上）')}${list(g.hit, '🎯 的中率重視（的中率30%以上）')}</div>`;
    }).join('');
  }
  // 表示する期待値の下限（既定 0.9。端末に保存）
  function evControl() {
    return `<div class="seg evsel" style="align-items:center"><span class="muted">表示する期待値</span>${EV_OPTIONS.map(([lab, v]) =>
      `<button data-ev="${v}" class="${st.evMin === v ? 'on' : ''}">${v ? lab + '以上' : lab}</button>`).join('')}</div>`;
  }
  function bindEv() {
    app.querySelectorAll('.evsel button').forEach((b) => b.onclick = (e) => { e.stopPropagation(); st.evMin = parseFloat(b.dataset.ev); store.set('kb_evmin', String(st.evMin)); render(); });
  }
  function bindBack() { const b = document.getElementById('back'); if (b) b.onclick = () => { st.page = 'board'; st.race = null; st.raceData = null; render(); }; }

  // ---- 起動
  if (!window.crypto || !crypto.subtle || typeof DecompressionStream === 'undefined') {
    app.innerHTML = '<div class="login card">このブラウザは対応していません。最新の Safari / Chrome で開いてください。</div>';
    return;
  }
  st.view = store.get('kb_view') || 'single';
  { const v = parseFloat(store.get('kb_evmin')); if (!Number.isNaN(v)) st.evMin = v; }
  const saved = store.get('kb_pw');
  if (saved) {
    st.pw = saved;
    load(saved).then(() => afterLogin()).catch((e) => { store.del('kb_pw'); loginView(e.name === 'OperationError' ? '保存したパスワードが使えません' : e.message); });
  } else {
    loginView();
  }
})();
</script>
</body>
</html>
