# 毎朝、前日の全レース（出走表・着順・払戻・最終オッズ）を同じ結果ページから収集してコミットする。
# オッズと結果は同じページから取るため、必ず同じレースでそろう。
name: keirin-collect

on:
  schedule:
    - cron: "7 21 * * *"   # 毎日 06:07 JST（前日分）
  workflow_dispatch:
    inputs:
      date:
        description: "収集する日 YYYYMMDD（空欄なら前日）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: keirin-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 収集
        env:
          TARGET_DATE: ${{ inputs.date }}
        run: python keirin_collector.py "$TARGET_DATE"
      - name: そろい具合チェック
        run: |
          pip install --quiet pandas numpy scipy
          python analysis/check_data.py | tail -8
      - name: コミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "data: 競輪データ収集 $(date -u -d '+9 hours' +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
