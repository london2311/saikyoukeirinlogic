# 発走前のオッズ（全券種）を各レースの 締切15分前・10分前・5分前・2分前（締切は発走の5分前）に記録し、
# 事前登録した買い方（strategies.json の alert）に該当すれば自分宛てにメールで知らせる。
# 期待値ボード（live/index.html）用に、全券種の期待値を暗号化して site-data ブランチに置く（パスワードで閲覧）。
# 記録は非公開のデータ用リポジトリにだけコミットする。
# 「締切直前のオッズで判定したら本当に儲かるか」を正しく検証するためのデータ（結果ページの最終オッズとは別）。
#
# 重要: netkeirin 利用規約により、データは私的利用の範囲内でのみ利用できる。
#   * このリポジトリ（公開）には何もコミットしない。ログには件数・成功/失敗だけを出す。
#   * DATA_REPO / DATA_REPO_TOKEN が未設定なら何もせず終了する。
# 実行はリレー方式: 1回の実行は約5時間半（ジョブの上限6時間の手前）で終わり、終わる直前に次の実行を自分で予約する。
# GitHub の定時実行は数時間遅れたり、実行されないことがあるため、定時実行はリレーが途切れた時の再開用。
# その日のレースが終わったら、同じ実行のまま翌日の予定に切り替えて、翌日の分を続けて記録する。
# 止めたい時: リポジトリの Variables に SNAPSHOT_RELAY=off（定時実行は動く）。サーバーから拒否された時もリレーは止まる。
name: netkeirin-snapshot

on:
  schedule:
    - cron: "13 23 * * *"   # 08:13 JST（リレーが途切れていた時の再開用。以下同じ）
    - cron: "7 4 * * *"     # 13:07 JST
    - cron: "41 9 * * *"    # 18:41 JST
    - cron: "3 15 * * *"    # 00:03 JST
  workflow_dispatch:
    inputs:
      hours:
        description: "この実行で記録する時間（最大5.5）"
        required: false
        default: "5.5"

permissions:
  contents: write  # 期待値ボードの暗号化データを site-data ブランチに置くため（データ本体は非公開リポジトリのみ）
  actions: write   # 次の実行を予約する（リレー）

concurrency:
  group: netkeirin-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: 設定の確認
        id: cfg
        env:
          DATA_REPO: ${{ vars.DATA_REPO }}
          HAS_TOKEN: ${{ secrets.DATA_REPO_TOKEN != '' }}
          HOURS_INPUT: ${{ inputs.hours }}
        run: |
          if [ -z "$DATA_REPO" ] || [ "$HAS_TOKEN" != "true" ]; then
            echo "::warning::DATA_REPO / DATA_REPO_TOKEN が未設定のため、何もせず終了します。"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          HOURS="${HOURS_INPUT:-5.5}"
          echo "hours=$HOURS" >> "$GITHUB_OUTPUT"
          # 前の時間帯の終了を待って始まった場合でも、日付は JST の今日
          echo "date=$(TZ=Asia/Tokyo date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'

      - name: データ用リポジトリ（非公開）を取得
        if: steps.cfg.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: _data_repo

      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - name: 記録（保存先は _data_repo/data のみ。1時間ごとにコミット）
        if: steps.cfg.outputs.ok == 'true'
        env:
          HOURS: ${{ steps.cfg.outputs.hours }}
          DAY: ${{ steps.cfg.outputs.date }}
          # 通知メール（任意）: Settings → Secrets and variables → Actions に登録。未設定なら判定だけ行う
          ALERT_GMAIL_USER: ${{ secrets.ALERT_GMAIL_USER }}
          ALERT_GMAIL_APP_PASSWORD: ${{ secrets.ALERT_GMAIL_APP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          # 期待値ボード（任意）: 12文字以上のパスワード。未設定なら作らない
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          # その日のレースが終わったら、結果の収集（→ 台帳・検証レポート）を予約する
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          pip install --quiet numpy pandas scipy cryptography
          cat > /tmp/flush.sh <<'SH'
          cd _data_repo || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then git pull -q --rebase || true; exit 0; fi  # 変更が無くても最新（毎朝の検証レポート等）を取り込む
          git commit -q -m "data: 発走前オッズ $(TZ=Asia/Tokyo date +%Y-%m-%d\ %H:%M)"
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && exit 0; sleep $((i * 5)); done
          echo "::warning::コミットの push に失敗（次回の flush で再試行）"
          SH
          python netkeirin_snapshot.py --out-dir _data_repo/data --date "$DAY" --hours "$HOURS" --blocked-flag /tmp/blocked \
            --offsets 15,10,5,2 --alert --alert-snaps C-5,C-2 --site --drift _data_repo/data/ledger/drift.json \
            --report _data_repo/data/ledger/daily_report.json \
            --flush-cmd "bash /tmp/flush.sh" --flush-min 60 \
            --on-day-done "gh workflow run netkeirin-collect.yml -R $REPO --ref $REF -f date={date} -f wait_min=45"

      - name: 次の実行を予約（リレー）
        # 手動でキャンセルした時・SNAPSHOT_RELAY=off の時・サーバーから拒否された時は予約しない
        if: ${{ !cancelled() && steps.cfg.outputs.ok == 'true' && vars.SNAPSHOT_RELAY != 'off' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/blocked ]; then echo "::warning::サーバーから拒否されたため、リレーを止めます"; exit 0; fi
          gh workflow run netkeirin-snapshot.yml -R "${{ github.repository }}" --ref "${{ github.ref_name }}"
          echo "次の実行を予約しました"
